<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3B0006" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#9B0014"/>
    </linearGradient>
    <linearGradient id="ribbon3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B70228"/>
      <stop offset="100%" stop-color="#5B000E"/>
    </linearGradient>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Dark Tech Circular Squircle Canvas -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bgCircle)" filter="url(#shadow4)"/>
  <rect x="42" y="42" width="428" height="428" rx="98" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Dynamic Origami Ribbon Sheets forming Document Fold -->
  <g filter="url(#shadow4)">
    <!-- Back Sheet facet -->
    <path d="M 140 100 L 280 100 L 372 192 L 372 412 L 140 412 Z" fill="url(#ribbon3)"/>
    <!-- Fold corner -->
    <path d="M 280 100 L 280 192 L 372 192 Z" fill="#FF4B2B" opacity="0.9"/>
    
    <!-- Dynamic Infinity Front Ribbon -->
    <path d="M 116 220 Q 200 170 300 230 Q 380 280 396 350 L 350 376 Q 330 320 270 284 Q 190 240 116 280 Z" fill="url(#ribbon1)"/>
    <path d="M 116 280 Q 180 340 270 340 L 270 380 Q 160 380 84 310 Z" fill="url(#ribbon2)"/>
  </g>

  <!-- Futuristic Clean Typography -->
  <text x="256" y="280" font-family="'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">PDF</text>
  <text x="256" y="318" font-family="'Segoe UI', Roboto, sans-serif" 
        font-weight="600" font-size="20" fill="#FFA3AF" text-anchor="middle" letter-spacing="8">CRAFT</text>
</svg>